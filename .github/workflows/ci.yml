name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore Bolttagu.slnx
      - run: dotnet build Bolttagu.slnx --no-restore -c Release
      - run: dotnet test tests/Bolttagu.Architecture.Tests/Bolttagu.Architecture.Tests.csproj --no-build -c Release
      - run: dotnet publish src/Bolttagu.App/Bolttagu.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o artifacts/p0/win-x64
