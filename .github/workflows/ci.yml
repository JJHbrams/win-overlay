name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore Bolttagu.slnx
      - name: Build deterministic art pack
        shell: pwsh
        run: |
          dotnet run --project tools/Bolttagu.AssetBuild -- all
          $first = (Get-Content asset/bolttagu/build/build-manifest.json | ConvertFrom-Json).buildHash
          dotnet run --project tools/Bolttagu.AssetBuild -- all
          $second = (Get-Content asset/bolttagu/build/build-manifest.json | ConvertFrom-Json).buildHash
          if ($first -ne $second) { throw "Asset build is not deterministic: $first != $second" }
      - run: dotnet build Bolttagu.slnx --no-restore -c Release
      - run: dotnet test Bolttagu.slnx --no-build --no-restore -c Release
      - name: Publish Windows x64 release
        shell: pwsh
        run: ./scripts/Publish-WinX64.ps1
      - name: Upload Windows x64 release
        uses: actions/upload-artifact@v4
        with:
          name: Bolttagu-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error
